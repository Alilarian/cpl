alg: MixedCPL
alg_kwargs:
  alpha: 0.1
  contrastive_bias: 0.75   # shared across every component in the mix
  bc_steps: 0              # no BC warmup
  bc_coeff: 0.0
  component_weights: {}    # per-run override: {<base>: 1.0, <secondary>: 0.1}

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    dropout: 0.25
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [512, 512]
    ortho_init: True

checkpoint: null

eval_env: mw_drawer-open-v2

# components filled in per-run by scripts/generate_mixed_cpl_manifest.py --
# see research/datasets/mixed_buffer.py for the shared (obs, action, label)
# contract every component's dataset_class must satisfy.
dataset: MixedFeedbackBuffer
dataset_kwargs:
  batch_size: 96
  components: []

processor: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 500000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: null
