alg: DiscountedCorrCPL
alg_kwargs:
  alpha: 0.1
  discount: 0.99
  contrastive_bias: 0.75
  bc_steps: 0
  bc_coeff: 0.0

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    dropout: 0.25
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [512, 512]
    ortho_init: True

checkpoint: null

eval_env: mw_drawer-open-v2

# Cumulative E-stop model (cumulative_estop_model.md). Trains on one flat,
# pre-shuffled 50/50 mix of the two branches (stop_correction, no_stop_demo),
# built by scripts/build_cum_estop_mix.py -- both arms are always full,
# equal-length (obs, action, reward) pairs in CorrBuffer's existing schema,
# so no new buffer class is needed. DiscountedCorrCPL applies a real
# discount from t=0 so a stop_correction row's shared prefix (up to
# stop_index) cancels out of the comparison with a gamma**tau scale on the
# diverging suffix (spec Section 9.2) -- the same discount also applies to
# no_stop_demo rows (no shared prefix there, but the same global scoring
# convention per spec Section 9.1), since rows aren't tagged by branch at
# training time.
dataset: CorrBuffer
dataset_kwargs:
  path: datasets/cum_estop_labels/mw_drawer-open-v2/cum_estop_mix10000.npz
  batch_size: 96
  capacity: null

processor: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 250000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: null
