
alg: RewardCPL
alg_kwargs:
  contrastive_bias: 1.0   # unbiased -- see reward_cpl.py docstring for why bias!=1.0 doesn't transfer from ARIC
  discount: 1.0            # matches corr_cpl.yaml (DemoCPL applies no discount)
  l2_coeff: 0.0

optim: Adam
optim_kwargs:
  lr: 0.0003

network: RewardPolicy
network_kwargs:
  reward_class: ContinuousMLPCritic
  reward_kwargs:
    ensemble_size: 1
  dropout: 0.25   # matches the actor's dropout in corr_cpl.yaml
  act: ["import", "torch.nn", "ReLU"]
  hidden_layers: [512, 512]
  ortho_init: True

checkpoint: null

# eval_env is required even though this algorithm has no actor to roll out --
# Config.get_eval_env_fn()/get_spaces() always construct a real env to derive
# observation/action spaces. eval_fn: null below skips the (nonexistent) rollout.
eval_env: mw_drawer-open-v2

dataset: CorrBuffer
dataset_kwargs:
  path: datasets/mw/corr_labels/mw_drawer-open-v2/corr_labels.npz
  batch_size: 96
  segment_length: null
  reward_scale: 1.0
  reward_shift: 0.0
  capacity: null
  split: train
  val_frac: 0.1

validation_dataset_kwargs:
  split: val
  val_frac: 0.1

processor: null

trainer_kwargs:
  total_steps: 100000
  log_freq: 500
  profile_freq: 500
  eval_freq: 2000
  eval_fn: null
  loss_metric: reward_loss
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: null
