
alg: EstopCPL
alg_kwargs:
  alpha: 0.1
  discount: 0.99         # γ for the discounted advantage sum J_π(σ_{0:t})
  beta_prime: 1.0        # β' logit scaling in L = -log σ(β'(J_prefix − J_full))
  bc_steps: 20000        # shared BC warmup from bc_pool
  bc_coeff: 0.0
  # bc_pool_path: datasets/mw/bc_pool/mw_drawer-open-v2/bc_pool.npz

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    dropout: 0.25
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [512, 512]
    ortho_init: True

checkpoint: null

eval_env: mw_drawer-open-v2

# estop_labels.npz has (M, 2, T, ...) format with stop_time (M,):
#   index 0 = halt prefix σ_{0:τ}  (preferred)
#   index 1 = full trajectory σ_{0:T}  (non-preferred)
dataset: EstopBuffer
dataset_kwargs:
  path: datasets/mw/estop_labels/mw_drawer-open-v2/estop_labels.npz
  batch_size: 96
  reward_scale: 1.0
  reward_shift: 0.0

processor: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 500000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: null
