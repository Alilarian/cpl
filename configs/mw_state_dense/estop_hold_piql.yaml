
alg: EstopHoldPIQL
alg_kwargs:
  beta: 0.3333
  expectile: 0.7
  reward_steps: 50000
  reward_discount: 0.99     # matches estop_hold_cpl.yaml's EstopHoldCPL discount -- keep discount-matched
  beta_prime: 1.0           # matches estop_hold_cpl.yaml; plays the role contrastive_bias would
  transition_discount: 0.99 # IQL's Bellman-target discount -- a distinct concept from reward_discount above

optim: Adam
optim_kwargs:
  lr: 0.0003

network: ActorCriticValueRewardPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    dropout: 0.25 # only actor gets dropout sometimes.
    output_act: ["import", "torch.nn", "Tanh"]
  critic_class: ContinuousMLPCritic
  critic_kwargs:
    ensemble_size: 2
  value_class: MLPValue
  value_kwargs:
    ensemble_size: 1
  reward_class: ContinuousMLPCritic
  reward_kwargs:
    ensemble_size: 1
  act: ["import", "torch.nn", "ReLU"]
  hidden_layers: [512, 512]
  ortho_init: True

checkpoint: null

eval_env: mw_drawer-open-v2

# estop_hold_labels.npz: (M, 2, T, ...), ZERO-padded beyond a shared per-pair
# `horizon`. Index 0 = hold suffix (preferred), index 1 = original suffix.
# EstopHoldPIQL repeat-pads the tail internally (matching EstopPIQL's
# convention) before feeding it to the shared value/critic/actor machinery --
# see research/algs/piql.py::EstopHoldPIQL for why zero-padding can't be fed
# through unmasked. Reward net and IQL train jointly in one run, exactly like
# the original pairwise PIQL.
dataset: EstopHoldBuffer
dataset_kwargs:
  path: datasets/mw/estop_hold_labels/mw_drawer-open-v2/estop_hold_labels.npz
  batch_size: 96
  reward_scale: 1.0
  reward_shift: 0.0

schedule:
  actor: ["import", "torch.optim.lr_scheduler", "CosineAnnealingLR"]
schedule_kwargs:
  actor:
    T_max: 500000

processor: null

trainer_kwargs: # Arguments given to Algorithm.train
  total_steps: 500000 # The total number of steps to train
  log_freq: 500 # How often to log values
  profile_freq: 500
  eval_freq: 5000 # How often to run evals
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25 # Number of enviornment episodes to run for evaluation, or -1 if none should be run.
  loss_metric: reward # The validation metric that determines when to save the "best_checkpoint"
  train_dataloader_kwargs:
    num_workers: 0 # Number of dataloader workers.
    batch_size: null

seed: null
