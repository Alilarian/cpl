
alg: EstopHoldCPL
alg_kwargs:
  alpha: 0.1
  discount: 0.99         # γ for the discounted advantage sum J_π(σ), from the suffix start
  beta_prime: 1.0        # β' logit scaling in L = softplus(-β'(J_hold − J_orig))
  bc_steps: 20000        # shared BC warmup from bc_pool
  bc_coeff: 0.0
  # bc_pool_path: datasets/mw/bc_pool/mw_drawer-open-v2/bc_pool.npz

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    dropout: 0.25
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [512, 512]
    ortho_init: True

checkpoint: null

eval_env: mw_drawer-open-v2

# estop_hold_labels.npz has (M, 2, T, ...) format, ZERO-padded beyond a shared
# per-pair `horizon` (unlike estop_labels.npz's repeat-padded halt prefix):
#   index 0 = hold suffix H_tau  (preferred -- real simulated holding rollout)
#   index 1 = original suffix C_tau  (non-preferred -- recorded continuation)
# See generate_estop_hold_labels.py / research/datasets/estop_hold_buffer.py.
dataset: EstopHoldBuffer
dataset_kwargs:
  path: datasets/mw/estop_hold_labels/mw_drawer-open-v2/estop_hold_labels.npz
  batch_size: 96
  reward_scale: 1.0
  reward_shift: 0.0

processor: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 500000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: null
