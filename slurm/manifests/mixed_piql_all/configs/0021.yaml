import: configs/mw_state_dense/mixed_piql.yaml
eval_env: mw_drawer-open-v2
seed: 2
alg_kwargs:
  beta: 0.3333
  expectile: 0.7
  reward_steps: 50000
  contrastive_bias: 1.0
  transition_discount: 0.99
  component_weights:
    credit_assignment: 1.0
    pref: 0.1
dataset_kwargs:
  batch_size: 96
  components:
  - name: credit_assignment
    dataset_class: PMCreditAssignmentBuffer
    weight: 0.9
    dataset_kwargs:
      path: /scratch/general/vast/u1472210/mw_de_labels/mw_drawer-open-v2/credit_labels.npz
      capacity: null
      subsample_n: 9000
      subsample_seed: 0
  - name: pref
    dataset_class: CorrBuffer
    weight: 0.1
    dataset_kwargs:
      path: /scratch/general/vast/u1472210/mw_de_labels/mw_drawer-open-v2/pref_labels.npz
      capacity: null
      subsample_n: 1000
      subsample_seed: 0
