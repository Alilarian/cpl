# CPL training on PointMass with non-sequential E-stop feedback.
#
# Algorithm: PointMassEstopCPL  (halt-prefix vs full-trajectory BCE)
# Dataset:   EstopBuffer  — estop_labels.npz  (N, 2, T, 2) + stop_time
#
# Run
# ---
#   WANDB_PROJECT=pm-cpl-estop python scripts/train.py \
#       -c configs/pm_navigation/cpl_estop.yaml \
#       -p runs/pm_cpl_estop

alg: PointMassEstopCPL
alg_kwargs:
  alpha: 1.0
  discount: 1.0                # undiscounted advantage sum
  beta_prime: 1.0              # logit scaling in estop loss
  bc_coeff: 0.0
  bc_steps: 0                  # no BC warmup
  advantage_npz: runs/pm_sac_oracle/advantage_vi_N100.npz
  vis_grid_n: 30

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [256, 256]
    ortho_init: True
  hidden_layers: [256, 256]
  ortho_init: True

eval_env: pm_navigation-v0
eval_env_kwargs:
  step_cost: 0.01

dataset: EstopBuffer
dataset_kwargs:
  path: datasets/pm/estop_labels.npz
  batch_size: 64
  capacity: null

processor: null

checkpoint: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 100000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 20
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: 42
