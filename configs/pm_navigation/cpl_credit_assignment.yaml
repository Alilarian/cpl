# CPL training on PointMass with credit assignment feedback.
#
# Algorithm: PointMassCreditAssignmentCPL  (multi-way cross-entropy)
# Dataset:   PMCreditAssignmentBuffer — credit_assignment_labels.npz  (N, C, k=12, obs_dim)
#
# Credit assignment feedback model (ARIC):
#   Each pool trajectory (T=64) produces C=53 candidate windows of length k=12.
#   The oracle selects the window with the highest rl_sum advantage (argmax).
#   Loss: -log softmax(α Σ_t log π(a_t|s_t) for each c)[chosen_c]
#   Generated with: subsegment_len=12
#
# Run
# ---
#   WANDB_PROJECT=pm-cpl-credit_assignment python scripts/train.py \
#       -c configs/pm_navigation/cpl_credit_assignment.yaml \
#       -p runs/pm_cpl_credit_assignment

alg: PointMassCreditAssignmentCPL
alg_kwargs:
  alpha: 1.0
  contrastive_bias: 1.0        # downweight non-chosen candidates (0 < bias ≤ 1)
  bc_coeff: 0.0
  bc_steps: 0                  # no BC warmup
  advantage_npz: runs/pm_sac_oracle/advantage_vi_N100.npz
  vis_grid_n: 30

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    output_act: ["import", "torch.nn", "Tanh"]
    hidden_layers: [256, 256]
    ortho_init: True
  hidden_layers: [256, 256]
  ortho_init: True

eval_env: pm_navigation-v0
eval_env_kwargs:
  step_cost: 0.01

dataset: PMCreditAssignmentBuffer
dataset_kwargs:
  path: datasets/pm/credit_assignment_labels.npz
  # C=53 candidate windows of length k=12; generated with subsegment_len=12
  batch_size: 32
  capacity: null

processor: null

checkpoint: null

schedule:
  actor: linear_warmup
schedule_kwargs:
  actor:
    total_steps: 10000
    multiplier: 1.0

trainer_kwargs:
  total_steps: 100000
  log_freq: 500
  profile_freq: 500
  eval_freq: 5000
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 20
  loss_metric: reward
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null

seed: 42
